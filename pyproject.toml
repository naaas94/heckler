[project]
name = "heckler"
version = "0.1.0"
# Kokoro (TTS) publishes wheels only for CPython <3.13; see PyPI "Requires-Python" on kokoro.
requires-python = ">=3.11,<3.13"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "litellm>=1.40.0",
    "kokoro>=0.9.2",
    "torch>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
heckler = "heckler.pipeline:main"

[tool.setuptools.packages.find]
include = ["heckler*"]
