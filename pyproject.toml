[project]
name = "heckler"
version = "0.1.0"
# Kokoro (TTS) publishes wheels only for CPython <3.13; see PyPI "Requires-Python" on kokoro.
requires-python = ">=3.11,<3.13"
dependencies = [
    "sounddevice>=0.4.6",
    # NumPy 2.x breaks many stacks still built against the 1.x ABI (incl. older torch wheels).
    "numpy>=1.26,<2",
    "faster-whisper>=1.0.3",
    "litellm>=1.40.0",
    "kokoro>=0.9.2",
    # Kokoro → transformers imports torch.nn.attention.flex_attention; needs torch ≥2.5 internally.
    # Install CUDA wheels from the PyTorch index first (see README); plain `pip install .` may resolve CPU torch.
    # Silero VAD (torch.hub) imports torchaudio in its hub package; required at import time even for the JIT path.
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
heckler = "heckler.pipeline:main"

[tool.setuptools.packages.find]
include = ["heckler*"]
